
# ============================================================
# QUICKHELP - CONFIGURACIÓN DEL BACKEND
# ============================================================

# Nombre de la aplicación
spring.application.name=quickhelp-backend

# Conexión a PostgreSQL
#=spring.datasource.url=jdbc:postgresql://localhost:5432/quickHelp
#=spring.datasource.username=postgres
#=spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quickHelp}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
# Valida las tablas existentes sin crearlas ni eliminarlas.
spring.jpa.hibernate.ddl-auto=validate

# Mostrar las consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway / Migraciones PostgreSQL
# Ejecuta las migraciones antes de validar las entidades JPA.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Registra como línea base una base de datos existente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Clave utilizada para firmar los tokens JWT.
jwt.secret=${JWT_SECRET}

# Carga las credenciales privadas de desarrollo local.
spring.config.import=optional:classpath:application-local.properties

# ============================================================
# ESCALAMIENTO AUTOMÁTICO DE ALERTAS SOS
# ============================================================

# Fecha fija desde la cual se permiten nuevos escalamientos.
# Sin configurar la variable, no se generan nuevos reavisos.
quickhelp.escalamiento.fecha-activacion=${QUICKHELP_ESCALAMIENTO_FECHA_ACTIVACION:}
