name: Validar backend Quick Help

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - Wilcinot2024-patch-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar sin ejecutar pruebas
        run: mvn -B -DskipTests package

      # Muestra las dependencias relacionadas con Firebase y Google.
      - name: Revisar dependencias Firebase
        run: |
          mvn -B dependency:tree \
            -Dincludes=com.google.firebase:firebase-admin,com.google.auth:*,com.google.http-client:*,com.google.api-client:*,org.apache.httpcomponents.client5:*

