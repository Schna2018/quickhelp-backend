
# ============================================================
# QUICKHELP - CONFIGURACIÓN DEL BACKEND
# ============================================================

# Nombre de la aplicación
spring.application.name=quickhelp-backend

# Conexión a PostgreSQL
#=spring.datasource.url=jdbc:postgresql://localhost:5432/quickHelp
#=spring.datasource.username=postgres
#=spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quickHelp}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
# La base ya fue creada manualmente, por eso no queremos
# que Spring cree o elimine tablas automáticamente.
spring.jpa.hibernate.ddl-auto=validate

# Mostrar las consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave utilizada para firmar los tokens JWT.
jwt.secret=${JWT_SECRET}

# Carga las credenciales privadas de desarrollo local.
spring.config.import=optional:classpath:application-local.properties

# ============================================================
# MIGRACIONES DE POSTGRESQL - FLYWAY
# ============================================================

# Las migraciones permanecen desactivadas hasta validar
# la estrategia de incorporación a la base existente.
spring.flyway.enabled=false

# Permite reconocer una base de datos que ya tiene tablas.
spring.flyway.baseline-on-migrate=true

# La versión 1 corresponde al esquema existente.
spring.flyway.baseline-version=1

# Ubicación de las migraciones SQL.
spring.flyway.locations=classpath:db/migration

# ============================================================
# ESCALAMIENTO AUTOMÁTICO DE ALERTAS SOS
# ============================================================

# Fecha fija desde la cual se permiten nuevos escalamientos.
# Sin configurar la variable, no se generan nuevos reavisos.
quickhelp.escalamiento.fecha-activacion=${QUICKHELP_ESCALAMIENTO_FECHA_ACTIVACION:}
