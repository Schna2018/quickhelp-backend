# ============================================================
# QUICKHELP - CONFIGURACIÓN DEL BACKEND
# ============================================================

# Nombre de la aplicación
spring.application.name=quickhelp-backend

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/quickHelp
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
# La base ya fue creada manualmente, por eso no queremos
# que Spring cree o elimine tablas automáticamente.
spring.jpa.hibernate.ddl-auto=validate

# Mostrar las consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Clave utilizada para firmar los tokens JWT.
jwt.secret=${JWT_SECRET}
# Carga las credenciales privadas de desarrollo local.
spring.config.import=optional:classpath:application-local.properties