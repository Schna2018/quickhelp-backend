
name: Validar backend Quick Help

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - Wilcinot2024-patch-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar sin ejecutar pruebas
        run: mvn -B -DskipTests package
